<script>
window.addEventListener('load', function () {
  setTimeout(function () {
    var out = [];
    var vw = document.documentElement.clientWidth;
    out.push('viewport=' + vw + ' docScrollW=' + document.documentElement.scrollWidth + ' bodyScrollW=' + document.body.scrollWidth);
    document.querySelectorAll('div').forEach(function (el) {
      var cs = getComputedStyle(el);
      var scrollable = cs.overflowX === 'auto' || cs.overflowX === 'scroll';
      var r = el.getBoundingClientRect();
      if (scrollable && r.width > 40) {
        out.push('SCROLLER x=' + Math.round(r.left) + ' w=' + Math.round(r.width) + ' right=' + Math.round(r.right) +
                 ' scrollW=' + el.scrollWidth + ' padR=' + cs.paddingRight + ' marginL=' + cs.marginLeft +
                 ' firstChildPadL=' + (el.firstElementChild ? getComputedStyle(el.firstElementChild).paddingLeft : '-') +
                 ' firstChildPadR=' + (el.firstElementChild ? getComputedStyle(el.firstElementChild).paddingRight : '-'));
      }
      if (r.right > vw + 0.5 && r.width > 60) {
        out.push('OVERFLOW x=' + Math.round(r.left) + ' w=' + Math.round(r.width) + ' right=' + Math.round(r.right) + ' cls=' + (el.className || '').slice(0, 60));
      }
    });
    var pre = document.createElement('pre');
    pre.id = 'measure';
    pre.textContent = out.join('\n');
    document.body.appendChild(pre);
  }, 2500);
});
</script>
